name: 🧪 KRX 로그인 테스트

on:
  workflow_dispatch:      # 수동 실행 전용

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🐍 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 pykrx 설치
        run: |
          pip install --upgrade pip
          pip install pykrx

      - name: 🔑 Secret 확인
        env:
          UID: ${{ secrets.KRX_USER_ID }}
          UPW: ${{ secrets.KRX_USER_PW }}
        run: |
          [ -n "$UID" ] && echo "OK  KRX_USER_ID"  || echo "MISSING KRX_USER_ID"
          [ -n "$UPW" ] && echo "OK  KRX_USER_PW"  || echo "MISSING KRX_USER_PW"

      - name: 🧪 KRX 로그인 및 조회 테스트
        env:
          # pykrx는 KRX_ID / KRX_PW 를 읽으므로 매핑
          KRX_ID: ${{ secrets.KRX_USER_ID }}
          KRX_PW: ${{ secrets.KRX_USER_PW }}
        run: |
          python - << 'PYEOF'
          import os
          print("=" * 55)
          print("1) 환경변수 매핑 확인")
          print("=" * 55)
          print("  KRX_ID 설정됨:", bool(os.environ.get("KRX_ID")))
          print("  KRX_PW 설정됨:", bool(os.environ.get("KRX_PW")))
          print()

          from pykrx import stock

          print("=" * 55)
          print("2) KOSPI 지수 PBR/PER 조회 (2026년 1월)")
          print("=" * 55)
          try:
              df = stock.get_index_fundamental_by_date("20260101", "20260131", "1001")
              print("  조회 행 개수:", len(df))
              if len(df) == 0:
                  print("  ❌ 빈 데이터 — 로그인 실패 또는 회원제 차단")
                  print("     → pykrx 방식 불가, KRX OPEN API로 전환 필요")
              else:
                  print("  ✅ 데이터 수신 성공!")
                  print()
                  print("  컬럼:", list(df.columns))
                  print()
                  print(df.head().to_string())
                  print()
                  # PBR 컬럼 존재 확인
                  pbr_col = [c for c in df.columns if "PBR" in c.upper()]
                  if pbr_col:
                      print(f"  ✅ PBR 컬럼 확인: {pbr_col}")
                      print("     → 밸류에이션 계산 가능. 전체 코드 진행 가능")
                  else:
                      print("  ⚠️ PBR 컬럼 없음 — 다른 방식 필요")
          except Exception as e:
              print(f"  ❌ 오류 발생: {e}")
              print("     → KRX OPEN API로 전환 필요")

          print()
          print("=" * 55)
          print("3) 지수 종가 조회 (보조 확인)")
          print("=" * 55)
          try:
              ohlcv = stock.get_index_ohlcv_by_date("20260101", "20260110", "1001")
              print("  종가 조회 행:", len(ohlcv))
              if len(ohlcv):
                  print("  ✅ 지수 종가도 수신 성공")
          except Exception as e:
              print(f"  ❌ 종가 조회 실패: {e}")
          PYEOF
